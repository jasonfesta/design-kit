<form aria-labelledby="card-lab-title" class="care-card" id="checkin-form" novalidate="">
<div class="care-card-head">
<h3 id="card-lab-title">Lab check-in</h3>
<p class="care-card-sub">Morning phlebotomy slip routing for fasting eight-week panel</p>
</div>
<div class="contact-grid">
<div class="wl-field wl-field--full">
<label class="wl-label" for="wl-patient-email">Patient reminder email</label>
<input aria-describedby="wl-email-err wl-email-hint" aria-invalid="false" class="wl-input" id="wl-patient-email" name="email" placeholder="claire.lindqvist@post.se" required="" type="email"/>
<span class="wl-error" hidden="" id="wl-email-err">Enter a valid email address so we can send your lab slip.</span>
<span class="wl-hint" id="wl-email-hint">Used strictly for lab slips and appointment notices.</span>
</div>
<div class="wl-field wl-field--full">
<label class="wl-label" for="wl-clinic-loc">Preferred lab location</label>
<div class="select-wrap">
<select class="wl-select" id="wl-clinic-loc">
<option value="linden">Linden Street Preventive Care</option>
<option value="harbor">Harbor Park Morning Lab</option>
<option value="home">Home phlebotomy nurse</option>
</select>
<svg aria-hidden="true" class="select-chevron" fill="none" stroke="currentColor" stroke-width="1.6" viewbox="0 0 12 12"><path d="M2.5 4.5L6 8l3.5-3.5"></path></svg>
</div>
<span class="wl-hint">Fasting draws run 07:30 to 10:30 daily.</span>
</div>
<div class="wl-field wl-field--full">
<label class="wl-label" for="wl-chart-id">Order specimen ID</label>
<input class="wl-input specimen-id" id="wl-chart-id" readonly="" type="text" value="CL-2026-1105"/>
</div>
</div>
<div class="inline-actions">
<button class="wl-btn wl-btn--pri" type="submit">Save reminder</button>
<span class="wl-hint" hidden="" id="wl-form-saved" style="color:var(--ink-primary);font-weight:600">Reminder preferences saved.</span>
</div>
</form>
