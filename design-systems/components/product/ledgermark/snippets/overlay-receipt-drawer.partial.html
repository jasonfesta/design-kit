<dialog aria-labelledby="receipt-title" class="lm-drawer" id="receipt-drawer">
<div class="lm-dialog-head">
<h2 id="receipt-title" style="font-size: 1.375rem;">Northstar Design Studio</h2>
<button aria-label="Close split expense drawer" class="lm-btn lm-btn-ghost lm-btn-sm" data-close-dialog="" type="button">Close</button>
</div>
<p class="num" id="receipt-amount" style="font-size: 1.3125rem; font-weight: 500; margin-bottom: 20px;">−$12,500.00</p>
<dl class="lm-kv-list">
<dt>Account</dt>
<dd class="lm-acct-mono" id="receipt-acct">Checking •••• 4819</dd>
<dt>Date</dt>
<dd class="num" id="receipt-date">Nov 4 · Pending</dd>
<dt>Attachment</dt>
<dd id="receipt-note">brand-refresh-nov.pdf attached</dd>
</dl>
<div style="margin-top: 32px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<h3>Split expense</h3>
<span class="num muted" style="font-size: 0.8125rem;">Total 100%</span>
</div>
<div aria-hidden="true" class="lm-split-bar">
<div class="lm-split-seg-a" id="lm-split-bar-a" style="width: 60%;"></div>
<div class="lm-split-seg-b"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 0.84375rem; margin-bottom: 14px;">
<span>Engineering · <strong class="num" id="lm-eng-pct" style="font-weight: 600;">60%</strong></span>
<span>Product · <strong class="num" id="lm-prod-pct" style="font-weight: 600;">40%</strong></span>
</div>
<label class="lm-label sr-only" for="lm-split-slider">Engineering allocation percentage</label>
<input class="lm-range" id="lm-split-slider" max="90" min="10" step="5" style="--pct: 62.5%;" type="range" value="60"/>
</div>
<div class="lm-action-row" style="margin-top: 28px;">
<button class="lm-btn lm-btn-primary" id="lm-save-split" type="button">Save split</button>
<button class="lm-btn" data-close-dialog="" type="button">Close</button>
</div>
</dialog>
